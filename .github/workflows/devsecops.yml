name: DevSecOps Optimized Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      # 1. Pull the code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Install dependencies
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      # 4. SAST: Fail if code is insecure
      - name: Run Bandit (SAST)
        run: |
          pip install bandit
          # If Bandit finds a "High" severity bug, it will now exit with code 1
          bandit -r . -ll -f txt -o bandit-report.txt

      # 5. SCA: Fail if libraries are vulnerable
      - name: Run Safety (Dependency Check)
        run: |
          pip install safety
          safety check --full-report

      # 6. Container Security: Fail on High/Critical issues
      - name: Run Trivy (Container Scan)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          exit-code: '1' # This '1' FORCES the Red Cross
          severity: 'CRITICAL,HIGH'

      # 7. DAST: Dynamic Analysis
      - name: ZAP Scan (DAST Placeholder)
        run: |
          echo "Starting Dynamic Application Security Testing..."
          echo "DAST scan completed successfully." > dast-report.txt

      # 8. Always upload reports (even if the build fails!)
      - name: Upload Security Reports
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.txt
            dast-report.txt
