name: DevSecOps Optimized Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      # 1. Pull the code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Install dependencies
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      # 4. SAST: Check for security issues (STRICT)
      - name: Run Bandit (SAST)
        # We removed "continue-on-error: true" so it fails if bugs are found
        run: |
          pip install bandit
          bandit -r . -f txt -o bandit-report.txt

      # 5. SCA: Check for vulnerable libraries (STRICT)
      - name: Run Safety (Dependency Check)
        run: |
          pip install safety
          safety check --full-report

      # 6. Container Security: Scan filesystem (STRICT)
      - name: Run Trivy (Container Scan)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          exit-code: '1' # This '1' will force the pipeline to FAIL (RED) if vulnerabilities are found
          severity: 'CRITICAL,HIGH'

      # 7. DAST: Dynamic Analysis Placeholder
      - name: ZAP Scan (DAST Placeholder)
        run: |
          echo "Starting Dynamic Application Security Testing..."
          echo "DAST scan completed successfully." > dast-report.txt

      # 8. Upload reports (Only runs if previous steps pass or you use 'always()')
      - name: Upload Security Reports
        if: always() # This ensures you get your reports even if the build fails
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.txt
            dast-report.txt
