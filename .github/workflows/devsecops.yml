name: DevSecOps Optimized Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull the code from your repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup the Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Install dependencies and check for broken requirements
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Static Analysis (SAST) with Bandit
      # continue-on-error lets the pipeline finish even if bugs are found
      - name: Run Bandit (SAST)
        continue-on-error: true
        run: |
          pip install bandit
          bandit -r . -f txt -o bandit-report.txt
          cat bandit-report.txt

      # 5. Check for vulnerable libraries with Safety
      - name: Run Safety (Dependency Check)
        continue-on-error: true
        run: |
          pip install safety
          safety check --full-report

      # 6. Container Security (Optional - if you have a Dockerfile)
      - name: Run Trivy (Container Scan)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          exit-code: '0' # Change to '1' if you want to fail the build on high vulns
          severity: 'CRITICAL,HIGH'

      # 7. Upload reports so you can download them later
      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: bandit-report.txt

       # 8. Upload reports so you can download them later
    - name: Upload Security Reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          bandit-report.txt
          dast-report.txt
